<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindForest - 纯前端 ESA 边缘协作思维链</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- 添加Pusher用于WebSocket实时通信 -->
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>

    <style>
        body, html { height: 100%; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        /* 画布容器 */
        #cy {
            width: 100%; height: 100%;
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
            position: absolute; top: 0; left: 0;
            touch-action: none; 
            z-index: 0; 
        }

        /* Markdown & LaTeX 样式增强 */
        .prose { font-size: 0.95rem; line-height: 1.7; }
        .prose p { margin-bottom: 0.8em; }
        .prose pre { background: #1e293b !important; color: #e2e8f0; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 1em 0; }
        .prose code { background: #f1f5f9; padding: 0.2em 0.4em; border-radius: 0.25rem; color: #ef4444; font-size: 0.9em; font-family: monospace; }
        .prose pre code { background: transparent; color: inherit; padding: 0; }
        
        /* 表格样式 */
        .prose table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 0.9em; }
        .prose th, .prose td { border: 1px solid #e2e8f0; padding: 8px; text-align: left; }
        .prose th { background-color: #f8fafc; font-weight: 600; }

        /* KaTeX 溢出修复 */
        .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.5em 0; -webkit-overflow-scrolling: touch; }
        
        /* 动画 */
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.2s ease-out forwards; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        
        /* 区域标签 */
        .region-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: 1px solid #1e40af;
        }
        
        /* 连接状态 */
        .connection-status {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .status-online {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        
        .status-offline {
            background: linear-gradient(135deg, #6b7280, #4b5563);
            color: white;
        }
        
        .status-connecting {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
        }
        
        /* 用户头像颜色 */
        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: white;
        }
        
        .user-color-0 { background-color: #3b82f6; }
        .user-color-1 { background-color: #10b981; }
        .user-color-2 { background-color: #f59e0b; }
        .user-color-3 { background-color: #ef4444; }
        .user-color-4 { background-color: #8b5cf6; }
        .user-color-5 { background-color: #ec4899; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 flex" oncontextmenu="return false;"> 

    <aside class="w-64 bg-slate-900 text-white flex flex-col flex-shrink-0 z-40 shadow-xl relative" id="sidebar">
        <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900">
            <h1 class="font-bold text-xl tracking-wider"><i class="fa-solid fa-tree mr-2 text-green-400"></i>MindForest</h1>
        </div>
        
        <div class="px-4 py-3 bg-slate-800 border-b border-slate-700">
            <div class="flex justify-between items-center mb-1">
                <span class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Edge Access Point</span>
                <span class="flex items-center gap-1 text-[10px] text-green-400">
                    <span class="w-1.5 h-1.5 bg-green-400 rounded-full animate-pulse"></span>
                    <span id="latency-display">12ms</span>
                </span>
            </div>
            <select id="edge-region" class="w-full bg-slate-700 text-xs text-white border border-slate-600 rounded px-2 py-1.5 focus:outline-none focus:border-blue-500 cursor-pointer" onchange="simulateRegionSwitch()">
                <option value="bj">🇨🇳 CN-Beijing (Aliyun)</option>
                <option value="sg">🇸🇬 AP-Singapore (ESA)</option>
                <option value="fra">🇩🇪 EU-Frankfurt (ESA)</option>
                <option value="us">🇺🇸 US-Silicon Valley</option>
            </select>
        </div>

        <div class="p-3">
            <button onclick="createNewChat()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors shadow-lg text-sm font-medium mb-2">
                <i class="fa-solid fa-plus"></i> 新建思维链
            </button>
            <button onclick="showCreateRoomModal()" class="w-full bg-purple-600 hover:bg-purple-500 text-white py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors shadow-lg text-sm font-medium mb-2">
                <i class="fa-solid fa-users"></i> 创建协作房间
            </button>
            <button onclick="showJoinRoomModal()" class="w-full bg-green-600 hover:bg-green-500 text-white py-2 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors shadow-lg text-sm font-medium">
                <i class="fa-solid fa-door-open"></i> 加入协作房间
            </button>
        </div>

        <!-- 协作房间状态 -->
        <div id="collaboration-status" class="hidden p-3 border-t border-slate-700">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-semibold text-slate-300">协作房间</span>
                <span id="room-status" class="connection-status status-online">在线</span>
            </div>
            <div class="mb-2">
                <div class="text-xs text-slate-400 mb-1">房间ID:</div>
                <div class="flex items-center gap-2">
                    <code id="room-id-display" class="text-xs bg-slate-800 px-2 py-1 rounded flex-1 truncate"></code>
                    <button onclick="copyRoomId()" class="text-slate-400 hover:text-white p-1" title="复制房间ID">
                        <i class="fa-regular fa-copy text-xs"></i>
                    </button>
                </div>
            </div>
            <div class="mb-3">
                <div class="text-xs text-slate-400 mb-1">在线用户 (<span id="user-count">1</span>):</div>
                <div id="active-users-list" class="space-y-2"></div>
            </div>
            <button onclick="leaveRoom()" class="w-full bg-red-600 hover:bg-red-500 text-white py-1.5 px-3 rounded text-xs flex items-center justify-center gap-2 transition-colors">
                <i class="fa-solid fa-sign-out-alt"></i> 离开房间
            </button>
        </div>

        <div class="flex-1 overflow-y-auto px-3 py-2 space-y-2" id="history-list"></div>

        <div class="p-4 border-t border-slate-700 text-[10px] text-slate-400 text-center select-none">
            Accelerated by Aliyun ESA Edge
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative h-full">
        <header class="h-14 bg-white border-b flex items-center justify-between px-6 shadow-sm z-30 relative">
            <div class="flex items-center gap-4">
                <span id="current-chat-title" class="font-semibold text-gray-700">未命名对话</span>
                <!-- 协作房间标签 -->
                <div id="collab-badge" class="hidden flex items-center gap-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white px-3 py-1 rounded-full text-xs font-semibold">
                    <i class="fa-solid fa-users"></i>
                    <span id="collab-user-count">1</span>人在线
                </div>
                <!-- 区域标签 -->
                <div id="region-badge" class="hidden region-tag">
                    <i class="fa-solid fa-satellite"></i>
                    <span id="current-region-label">CN-BJ</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div id="sync-status" class="hidden flex items-center gap-1 text-xs text-gray-500">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <span>实时同步中</span>
                </div>
                <button onclick="toggleView()" class="flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-md transition-colors font-medium text-sm border border-slate-300">
                    <i class="fa-solid fa-project-diagram"></i>
                    <span id="view-toggle-text">切换思维树视图</span>
                </button>
            </div>
        </header>

        <div class="flex-1 relative overflow-hidden">
            <div id="stream-view" class="absolute inset-0 flex flex-col bg-white z-10 transition-opacity duration-300">
                <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-6 pb-48"></div>

                <div class="border-t bg-white p-4 absolute bottom-0 w-full z-20 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
                    <div class="flex flex-wrap gap-2 mb-2 px-1">
                        <div id="branch-indicator" class="hidden text-xs text-blue-600 font-semibold flex items-center gap-2 bg-blue-50 p-1.5 rounded border border-blue-100 animate-slide-up">
                            <i class="fa-solid fa-code-branch"></i>
                            <span>正在基于历史节点创建新分支...</span>
                            <button onclick="cancelBranching()" class="ml-2 hover:text-blue-800"><i class="fa-solid fa-times"></i></button>
                        </div>
                        <div id="file-preview" class="hidden flex items-center gap-2 bg-gray-100 p-1.5 rounded text-xs border border-gray-200 animate-slide-up">
                            <i class="fa-solid fa-file-word text-blue-600"></i>
                            <span id="file-name" class="font-mono text-gray-700 truncate max-w-[150px]">doc.docx</span>
                            <button onclick="clearFile()" class="ml-1 text-gray-500 hover:text-red-500"><i class="fa-solid fa-times"></i></button>
                        </div>
                        <div id="system-prompt-status" class="hidden flex items-center gap-2 bg-purple-50 p-1.5 rounded text-xs border border-purple-100 text-purple-700 animate-slide-up">
                            <i class="fa-solid fa-user-tag"></i>
                            <span class="font-semibold">人设:</span>
                            <span id="system-prompt-preview" class="truncate max-w-[100px]">默认</span>
                            <button onclick="toggleSystemPromptConfig()" class="ml-1 hover:text-purple-900 underline">修改</button>
                        </div>
                    </div>

                    <div class="relative max-w-5xl mx-auto flex gap-3 items-end">
                        <div class="flex flex-col gap-2 pb-1">
                            <button onclick="toggleSystemPromptConfig()" class="p-2 text-gray-500 hover:bg-purple-100 hover:text-purple-600 rounded-full transition-colors relative" title="设置 AI 人设">
                                <i class="fa-solid fa-masks-theater"></i>
                            </button>
                            <button onclick="document.getElementById('file-upload').click()" class="p-2 text-gray-500 hover:bg-blue-100 hover:text-blue-600 rounded-full transition-colors" title="上传 Word 文档">
                                <i class="fa-solid fa-paperclip"></i>
                            </button>
                        </div>
                        <input type="file" id="file-upload" class="hidden" accept=".docx" onchange="handleFileUpload(this)">

                        <div class="flex-1 relative">
                            <textarea id="user-input" rows="1" class="w-full pl-4 pr-12 py-3 bg-gray-100 border-0 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white resize-none shadow-sm max-h-32 overflow-y-auto text-sm" placeholder="输入内容... Enter 发送, Shift+Enter 换行" oninput="this.style.height='';this.style.height=Math.min(this.scrollHeight, 128)+'px'"></textarea>
                            <button onclick="sendMessage()" class="absolute right-2 bottom-2 p-2 text-blue-600 hover:bg-blue-100 rounded-lg transition-colors">
                                <i class="fa-solid fa-paper-plane text-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tree-view" class="absolute inset-0 opacity-0 pointer-events-none transition-opacity duration-300 z-20 bg-slate-50">
                <div id="cy"></div>
                
                <div class="absolute bottom-6 left-6 bg-white/90 backdrop-blur p-4 rounded-lg shadow-xl border border-gray-200 text-sm max-w-xs z-30 select-none pointer-events-none">
                    <h3 class="font-bold mb-2 text-gray-800 flex items-center gap-2"><i class="fa-solid fa-sitemap text-blue-500"></i> 操作指南</h3>
                    <ul class="space-y-1 text-gray-600 text-xs pl-1">
                        <li><i class="fa-solid fa-arrow-pointer w-4"></i> <b>左键点击</b>：跳转到该节点</li>
                        <li><i class="fa-regular fa-eye w-4"></i> <b>右键点击</b>：查看详细内容</li>
                        <li><i class="fa-solid fa-up-down-left-right w-4"></i> <b>滚轮/拖拽</b>：平移缩放</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <!-- 系统提示词模态框 -->
    <div id="system-prompt-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl w-96 p-6 animate-slide-up">
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-masks-theater text-purple-600"></i> 设置 AI 人设</h3>
            <textarea id="system-prompt-input" class="w-full h-32 p-3 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-purple-500 text-sm resize-none" placeholder="在此输入 System Prompt..."></textarea>
            <div class="flex justify-end gap-2 mt-4">
                <button onclick="toggleSystemPromptConfig()" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg text-sm">取消</button>
                <button onclick="saveSystemPrompt()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-sm">确认</button>
            </div>
        </div>
</div>

    <!-- 节点详情模态框 -->
    <div id="node-detail-modal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center backdrop-blur-sm" onclick="closeNodeDetail()">
        <div class="bg-white rounded-xl shadow-2xl w-[800px] max-w-[95%] max-h-[85vh] flex flex-col animate-slide-up" onclick="event.stopPropagation()">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl select-none">
                <div class="flex items-center gap-2">
                    <span id="detail-role-icon"></span>
                    <h3 class="font-bold text-gray-700">节点详情</h3>
                    <span id="detail-region-tag" class="ml-2 px-2 py-0.5 rounded text-[10px] bg-slate-200 text-slate-600 border border-slate-300 font-mono"></span>
                </div>
                <button onclick="closeNodeDetail()" class="text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full hover:bg-gray-200 flex items-center justify-center"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="p-6 overflow-y-auto prose prose-sm max-w-none" id="node-detail-content"></div>
            <div class="p-4 border-t bg-gray-50 rounded-b-xl flex justify-end">
                <button onclick="copyNodeContent()" class="text-blue-600 text-sm hover:underline"><i class="fa-regular fa-copy"></i> 复制内容</button>
            </div>
        </div>
    </div>

    <!-- 创建房间模态框 -->
    <div id="create-room-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl w-96 p-6 animate-slide-up">
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-users text-purple-600"></i> 创建协作房间</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">房间名称</label>
                    <input type="text" id="room-name-input" class="w-full p-3 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-purple-500 text-sm" placeholder="例如：量子计算研究讨论" value="协作思维树">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">您的显示名称</label>
                    <input type="text" id="host-name-input" class="w-full p-3 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-purple-500 text-sm" placeholder="输入您在房间中的显示名称" value="主持人">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">协作方式</label>
                    <select id="room-method" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-purple-500 text-sm">
                        <option value="pusher">Pusher实时同步（推荐，实时性好）</option>
                        <option value="polling">HTTP轮询（兼容性好）</option>
                    </select>
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeCreateRoomModal()" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg text-sm">取消</button>
                <button onclick="createCollaborationRoom()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-sm">创建房间</button>
            </div>
        </div>
    </div>

    <!-- 加入房间模态框 -->
    <div id="join-room-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl w-96 p-6 animate-slide-up">
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-door-open text-green-600"></i> 加入协作房间</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">房间ID或分享链接</label>
                    <input type="text" id="room-id-input" class="w-full p-3 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-green-500 text-sm" placeholder="输入房间ID或完整链接">
                    <p class="text-xs text-gray-500 mt-1">房间ID示例: <code class="bg-gray-100 px-1">abc123-def456</code></p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">您的显示名称</label>
                    <input type="text" id="user-name-input" class="w-full p-3 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-green-500 text-sm" placeholder="输入您在房间中的显示名称" value="协作者">
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeJoinRoomModal()" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg text-sm">取消</button>
                <button onclick="joinCollaborationRoom()" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm">加入房间</button>
            </div>
        </div>
    </div>

    <!-- 房间分享模态框 -->
    <div id="share-room-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-2xl w-96 p-6 animate-slide-up">
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-share-nodes text-blue-600"></i> 分享协作房间</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">房间ID</label>
                    <div class="flex items-center gap-2">
                        <code id="share-room-id" class="flex-1 p-3 border rounded-lg bg-gray-50 text-sm font-mono truncate"></code>
                        <button onclick="copyRoomId()" class="p-3 border rounded-lg hover:bg-gray-50">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">分享链接</label>
                    <div class="flex items-center gap-2">
                        <input type="text" id="share-room-url" readonly class="flex-1 p-3 border rounded-lg bg-gray-50 text-sm truncate">
                        <button onclick="copyShareUrl()" class="p-3 border rounded-lg hover:bg-gray-50">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>
                <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                    <p class="text-sm text-blue-700 flex items-start gap-2">
                        <i class="fa-solid fa-info-circle mt-0.5"></i>
                        <span>将此链接发送给其他人，他们即可加入房间参与实时协作。</span>
                    </p>
                </div>
            </div>
            <div class="flex justify-end mt-6">
                <button onclick="closeShareRoomModal()" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg text-sm">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // ================= 配置 =================
        const DEFAULT_SYSTEM_PROMPT = "你是一个智能助手。回答要专业、清晰，使用Markdown格式。";
        
        // ESA AI API 端点 - 使用您的ai.js函数

                });
                
                channel = pusher.subscribe(`mindforest-room-${roomId}`);
                
                channel.bind('client-node-add', (data) => {
                    if (data.userId !== userId) {
                        applyRemoteOperation(data);
                    }

                channel.bind('client-node-update', (data) => {
                    if (data.userId !== userId) {

                        if (data.updates && data.updates.length > 0) {
                            data.updates.forEach(update => {

                        if (data.users) {

            // 根据同步方式发送
            if (collaborationRoom.method === 'pusher' && channel) {
                // 使用Pusher广播
                switch (operation.type) {
                    case 'add_node':
                        channel.trigger('client-node-add', data);
                        break;
                    case 'update_node':
                        channel.trigger('client-node-update', data);
                        break;
                    case 'set_active_node':
                        channel.trigger('client-active-node-change', data);
                        break;
                    case 'update_system_prompt':
                        channel.trigger('client-system-prompt-update', data);
                        break;

            } else {
                // 使用HTTP API发送
                sendOperationToAPI(operation);
            }

        // 应用远程操作
        function applyRemoteOperation(data) {
            switch (data.type) {
                case 'add_node':
                    const node = { 
                        id: data.node.id, 
                        parentId: data.node.parentId, 
                        role: data.node.role, 
                        content: data.node.content, 
                        children: [], 
                        timestamp: data.node.timestamp,
                        systemPrompt: data.node.systemPrompt || currentSystemPrompt,
                        region: data.node.region || currentRegion 
                    };
                    nodeMap[node.id] = node;
                    if (node.parentId && nodeMap[node.parentId]) {
                        nodeMap[node.parentId].children.push(node.id);
                    } else if (!rootId) {
                        rootId = node.id;
                    }
                    break;
                    
                case 'update_node':
                    if (nodeMap[data.nodeId]) {
                        nodeMap[data.nodeId].content = data.content;
                        if (data.systemPrompt !== undefined) {
                            nodeMap[data.nodeId].systemPrompt = data.systemPrompt;
                        }
                    }
                    break;
                    
                case 'set_active_node':
                    activeNodeId = data.nodeId;
                    break;
                    
                case 'update_system_prompt':
                    currentSystemPrompt = data.prompt;
                    updateSystemPromptStatus();
                    break;
            }
            
            // 重新渲染
            renderStreamView();
            if (cy) {
                setTimeout(() => initTree(), 100);
            }
            
            // 显示操作通知
            if (data.userId !== userId) {

            }
        }

        // ================= 核心：终极公式清洗与渲染引擎 V2 =================
        function renderContent(text) {
            if (!text) return "";
            
            const mathMap = {};
            let mathIndex = 0;
            const generateToken = () => `MathToken${Date.now()}_${mathIndex++}_EndToken`;

            const replaceAndStore = (str, regex, wrapperStart = '', wrapperEnd = '') => {
                return str.replace(regex, (match, p1) => {
                    let content = p1 || match;
                    content = content.replace(/\$/g, '');
                    const token = generateToken();
                    mathMap[token] = wrapperStart + content + wrapperEnd;
                    return token;
                });
            };

            let safeText = text;
            safeText = replaceAndStore(safeText, /\\boxed\{[^{}]*(?:\{[^{}]*\}[^{}]*)*\}/g);
            safeText = replaceAndStore(safeText, /\$\$([\s\S]*?)\$\$/g, '$$', '$$');
            safeText = replaceAndStore(safeText, /\\\[([\s\S]*?)\\\]/g, '$$', '$$');
            safeText = replaceAndStore(safeText, /(\\begin\{[a-z]+\*?\}[\s\S]*?\\end\{[a-z]+\*?\})/g, '$$', '$$');
            safeText = replaceAndStore(safeText, /\\\(([\s\S]*?)\\\)/g, '\\(', '\\)');
            safeText = replaceAndStore(safeText, /(?<!\\)\$([^$\n]+?)(?<!\\)\$/g, '\\(', '\\)');

            let html = marked.parse(safeText);
            Object.keys(mathMap).forEach(token => {
                html = html.replace(token, mathMap[token]);
            });

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = html;
            
            renderMathInElement(tempDiv, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\begin{equation}', right: '\\end{equation}', display: true},
                    {left: '\\begin{align}', right: '\\end{align}', display: true},
                    {left: '\\begin{alignat}', right: '\\end{alignat}', display: true},
                    {left: '\\begin{gather}', right: '\\end{gather}', display: true},
                    {left: '\\begin{CD}', right: '\\end{CD}', display: true},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError: false,
                output: 'html', 
                strict: false,
                trust: true
            });

            return tempDiv.innerHTML;
        }

        function getRegionLabel(code) {
            const map = {
                'bj': { flag: '🇨🇳', name: 'CN-BJ' },
                'sg': { flag: '🇸🇬', name: 'AP-SG' },
                'fra': { flag: '🇩🇪', name: 'EU-FRA' },
                'us': { flag: '🇺🇸', name: 'US-SV' }
            };
            return map[code] || map['bj'];
        }
        
        function updateRegionDisplay() {
            if (collaborationRoom) {
                document.getElementById('current-region-label').textContent = 
                    getRegionLabel(currentRegion).name;
                document.getElementById('region-badge').classList.remove('hidden');
            }
        }

        // ================= 节点管理 =================
        function createNode(role, content, parentId = null, systemPromptSnapshot = null) {
            const id = Date.now().toString(36) + Math.random().toString(36).substr(2);
            const node = { 
                id, parentId, role, content, 
                children: [], 
                timestamp: Date.now(),
                systemPrompt: systemPromptSnapshot || currentSystemPrompt,
                region: currentRegion 
            };
            nodeMap[id] = node;
            if (parentId && nodeMap[parentId]) nodeMap[parentId].children.push(id);
            else rootId = id;
            
            // 广播节点添加操作
            if (collaborationRoom) {
                broadcastNodeOperation({
                    type: 'add_node',
                    node: node
                });
            }
            
            return node;
        }

        // ================= 视图逻辑 =================
        function renderStreamView() {
            const container = document.getElementById('chat-container');
            container.innerHTML = ''; 
            if (!activeNodeId) return;

            const path = getLineage(activeNodeId);
            const lastNode = path[path.length - 1];
            if (lastNode && lastNode.systemPrompt) currentSystemPrompt = lastNode.systemPrompt;
            if (lastNode && lastNode.region) currentRegion = lastNode.region; 

            updateSystemPromptStatus();
            updateRegionDisplay();

            path.forEach(node => {
                const isUser = node.role === 'user';
                const regInfo = getRegionLabel(node.region || 'bj');
                
                let branchNav = '';
                if (node.parentId) {
                    const parent = nodeMap[node.parentId];
                    if (parent && parent.children.length > 1) {
                        const idx = parent.children.indexOf(node.id);
                        branchNav = `
                            <div class="flex items-center gap-2 text-xs text-gray-400 mb-1 select-none">
                                <button onclick="switchSibling('${parent.id}', -1, '${node.id}')" class="hover:text-blue-600 p-1"><i class="fa-solid fa-chevron-left"></i></button>
                                <span>分支 ${idx + 1}/${parent.children.length}</span>
                                <button onclick="switchSibling('${parent.id}', 1, '${node.id}')" class="hover:text-blue-600 p-1"><i class="fa-solid fa-chevron-right"></i></button>
                            </div>`;
                    }
                }

                const div = document.createElement('div');
                div.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} animate-slide-up`;
                
                const renderedHtml = renderContent(node.content);
                
                const regionTag = `<div class="absolute -top-3 ${isUser?'right-2':'left-2'} bg-slate-100 border border-slate-200 text-[9px] text-slate-500 px-1.5 rounded-full shadow-sm select-none z-10 flex items-center gap-1">
                    <span>${regInfo.flag}</span> <span class="font-mono">ESA:${regInfo.name}</span>
                </div>`;

                div.innerHTML = `
                    <div class="flex flex-col ${isUser ? 'items-end' : 'items-start'} max-w-[90%] lg:max-w-[80%] group relative mt-4">
                        ${regionTag}
                        ${branchNav}
                        <div class="relative px-5 py-3 rounded-2xl shadow-sm text-sm leading-relaxed ${isUser ? 'bg-blue-600 text-white rounded-tr-none' : 'bg-white border border-gray-100 text-gray-800 rounded-tl-none'}">
                            <div class="prose prose-sm max-w-none ${isUser?'text-white':''}">${renderedHtml}</div>
                            <div class="absolute -bottom-6 ${isUser ? 'right-0' : 'left-0'} opacity-0 group-hover:opacity-100 transition-opacity flex gap-2">
                                <button onclick="setBranchPoint('${node.id}')" class="text-xs text-gray-400 hover:text-blue-600 flex items-center gap-1 bg-white/80 px-2 py-1 rounded shadow-sm border">
                                    <i class="fa-solid fa-code-branch"></i> 在此分叉
                                </button>
                            </div>
                        </div>
                    </div>`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function getLineage(endNodeId) {
            const path = [];
            let curr = endNodeId;
            while (curr && nodeMap[curr]) {
                path.unshift(nodeMap[curr]);
                curr = nodeMap[curr].parentId;
            }
            return path;
        }
        
        function switchSibling(parentId, direction, currentNodeId) {
            const parent = nodeMap[parentId];
            const idx = parent.children.indexOf(currentNodeId);
            const nextIdx = idx + direction;
            if (nextIdx >= 0 && nextIdx < parent.children.length) {
                activeNodeId = findDeepestLatestDescendant(parent.children[nextIdx]);
                renderStreamView();
                saveCurrentChat();
                
                // 广播活动节点变更
                if (collaborationRoom) {
                    broadcastNodeOperation({
                        type: 'set_active_node',
                        nodeId: activeNodeId
                    });
                }
            }
        }
        
        function findDeepestLatestDescendant(nodeId) {
            let curr = nodeMap[nodeId];
            while(curr.children && curr.children.length > 0) {
                curr = nodeMap[curr.children[curr.children.length - 1]];
            }
            return curr.id;
        }
        
        function setBranchPoint(nodeId) {
            branchParentId = nodeId;
            document.getElementById('branch-indicator').classList.remove('hidden');
            document.getElementById('user-input').focus();
        }
        
        function cancelBranching() {
            branchParentId = null;
            document.getElementById('branch-indicator').classList.add('hidden');
        }

        // ================= 发送消息 =================
        async function sendMessage() {
            const inputEl = document.getElementById('user-input');
            let content = inputEl.value.trim();
            if (!content && !currentFileContent) return;
            inputEl.value = ''; inputEl.style.height = 'auto';

            let displayContent = content; 
            let finalPrompt = content;

            if (currentFileContent) {
                finalPrompt = `【文档内容】\n${currentFileContent}\n\n【用户指令】\n${content || "请分析文档"}`;
                displayContent = `📂 [Word] ${currentFileName}\n${content}`;
                clearFile();
            }

            let parentId = branchParentId || activeNodeId;
            let userNode;

            if (!rootId && !parentId) {
                userNode = createNode('user', displayContent, null); 
                activeNodeId = userNode.id;
            } else {
                userNode = createNode('user', displayContent, parentId);
                parentId = userNode.id;
                activeNodeId = userNode.id;
            }
            
            cancelBranching();
            renderStreamView();
            saveCurrentChat();

            const historyNodes = getLineage(parentId);
            const messages = historyNodes.map(n => ({
                role: n.role,
                content: n.id === userNode.id ? finalPrompt : n.content 
            }));
            messages.unshift({ role: "system", content: currentSystemPrompt });

            const container = document.getElementById('chat-container');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = "flex flex-col items-start animate-slide-up mt-4";
            loadingDiv.innerHTML = `<div class="bg-white border border-gray-100 px-5 py-3 rounded-2xl rounded-tl-none shadow-sm"><div class="flex gap-1 h-5 items-center"><div class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div><div class="typing-dot w-2 h-2 bg-gray-400 rounded-full"></div></div></div>`;
            container.appendChild(loadingDiv);
            container.scrollTop = container.scrollHeight;

            try {
                const aiNode = createNode('assistant', '', parentId);
                activeNodeId = aiNode.id;

                // 调用ESA AI API
                const response = await fetch(ESA_AI_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        model: "deepseek-v3", 
                        messages: messages, 
                        stream: true 
                    })
                });

                if (!response.ok) throw new Error('API Error');
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";
                
                loadingDiv.remove();
                renderStreamView(); 
                
                const allBubbles = container.querySelectorAll('.prose');
                const lastBubble = allBubbles[allBubbles.length - 1];

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const jsonStr = line.slice(6);
                            if (jsonStr === '[DONE]') break;
                            try {
                                const json = JSON.parse(jsonStr);
                                fullText += json.choices[0].delta.content || "";
                                lastBubble.innerHTML = renderContent(fullText); 
                                container.scrollTop = container.scrollHeight;
                            } catch (e) {}
                        }
                    }
                }
                aiNode.content = fullText;
                lastBubble.innerHTML = renderContent(fullText);
                
                // 广播AI节点更新
                if (collaborationRoom) {
                    broadcastNodeOperation({
                        type: 'update_node',
                        nodeId: aiNode.id,
                        content: fullText,
                        systemPrompt: currentSystemPrompt
                    });
                }
                
                saveCurrentChat();
            } catch (error) {
                loadingDiv.innerHTML = `<div class="text-red-500">Error: ${error.message}</div>`;
            }
        }

        // ================= 树状图 (Cytoscape) =================
        let cy = null;

        function toggleView() {
            const streamView = document.getElementById('stream-view');
            const treeView = document.getElementById('tree-view');
            const btnText = document.getElementById('view-toggle-text');

            if (streamView.style.opacity === '0') {
                streamView.style.opacity = '1';
                streamView.style.pointerEvents = 'auto';
                treeView.style.opacity = '0';
                treeView.style.pointerEvents = 'none';
                btnText.innerText = "切换思维树视图";
            } else {
                streamView.style.opacity = '0';
                streamView.style.pointerEvents = 'none';
                treeView.style.opacity = '1';
                treeView.style.pointerEvents = 'auto';
                btnText.innerText = "返回对话视图";
                setTimeout(() => { initTree(); if (cy) { cy.resize(); cy.fit(); } }, 50);
            }
        }

        function initTree() {
            if (!rootId) return;
            if (cy) cy.destroy();

            const elements = [];
            Object.values(nodeMap).forEach(node => {
                const label = node.role === 'user' ? '👤 ' + node.content.substring(0, 10) : '🤖 ' + node.content.substring(0, 10);
                const safeLabel = label.replace(/\n/g, ' ');
                elements.push({
                    data: { 
                        id: node.id, 
                        label: safeLabel + (node.content.length > 10 ? '...' : ''),
                        fullContent: node.content,
                        role: node.role,
                        region: node.region || 'bj'
                    }
                });
                if (node.parentId) elements.push({ data: { source: node.parentId, target: node.id } });
            });

            cy = cytoscape({
                container: document.getElementById('cy'),
                elements: elements,
                wheelSensitivity: 0.05, 
                minZoom: 0.4,
                maxZoom: 1.5,
                style: [
                    {
                        selector: 'node',
                        style: {
                            'background-color': ele => ele.data('role') === 'user' ? '#2563eb' : '#ffffff',
                            'label': 'data(label)',
                            'color': ele => ele.data('role') === 'user' ? '#fff' : '#334155',
                            'text-valign': 'center', 'text-halign': 'center',
                            'width': 'label', 'height': 36, 'padding': '12px',
                            'shape': 'round-rectangle',
                            'border-width': 1, 'border-color': '#94a3b8', 'font-size': '12px'
                        }
                    },
                    {
                        selector: 'edge',
                        style: { 'width': 2, 'line-color': '#cbd5e1', 'target-arrow-color': '#cbd5e1', 'target-arrow-shape': 'triangle', 'curve-style': 'bezier' }
                    },
                    {
                        selector: `#${activeNodeId}`,
                        style: { 'border-color': '#10b981', 'border-width': 3, 'background-color': '#d1fae5', 'color': '#065f46' }
                    }
                ],
                layout: { name: 'breadthfirst', directed: true, padding: 50, spacingFactor: 1.2 }
            });

            cy.on('tap', 'node', function(evt){
                activeNodeId = evt.target.id();
                renderStreamView(); 
                toggleView(); 
                setTimeout(() => {
                    const allBubbles = document.getElementById('chat-container').querySelectorAll('.group');
                    if (allBubbles.length > 0) allBubbles[allBubbles.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 100);
                
                // 广播活动节点变更
                if (collaborationRoom) {
                    broadcastNodeOperation({
                        type: 'set_active_node',
                        nodeId: activeNodeId
                    });
                }
            });

            cy.on('cxttap', 'node', function(evt){
                showNodeDetail(evt.target.data());
            });
            
            cy.ready(() => cy.fit());
        }

        // ================= 弹窗逻辑 =================
        function showNodeDetail(nodeData) {
            const modal = document.getElementById('node-detail-modal');
            const contentDiv = document.getElementById('node-detail-content');
            const iconSpan = document.getElementById('detail-role-icon');
            const regionTag = document.getElementById('detail-region-tag');
            
            if (nodeData.role === 'user') iconSpan.innerHTML = '<i class="fa-solid fa-user text-blue-600"></i>';
            else iconSpan.innerHTML = '<i class="fa-solid fa-robot text-purple-600"></i>';

            const reg = getRegionLabel(nodeData.region || 'bj');
            regionTag.innerHTML = `${reg.flag} ESA Edge: ${reg.name}`;

            contentDiv.innerHTML = renderContent(nodeData.fullContent);
            modal.classList.remove('hidden');
        }

        function closeNodeDetail() {
            document.getElementById('node-detail-modal').classList.add('hidden');
        }

        function copyNodeContent() {
            const content = document.getElementById('node-detail-content').innerText;
            navigator.clipboard.writeText(content).then(() => alert('已复制'));
        }

        function toggleSystemPromptConfig() {
            const modal = document.getElementById('system-prompt-modal');
            const input = document.getElementById('system-prompt-input');
            if (modal.classList.contains('hidden')) {
                input.value = currentSystemPrompt;
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }
        
        function saveSystemPrompt() {
            const val = document.getElementById('system-prompt-input').value.trim();
            if (val) {
                currentSystemPrompt = val;
                updateSystemPromptStatus();
                
                // 广播系统提示词更新
                if (collaborationRoom) {
                    broadcastNodeOperation({
                        type: 'update_system_prompt',
                        prompt: val
                    });
                }
            }
            toggleSystemPromptConfig();
        }
        
        // 更新系统提示词状态显示
        function updateSystemPromptStatus() {
            const statusEl = document.getElementById('system-prompt-status');
            const previewEl = document.getElementById('system-prompt-preview');
            
            if (currentSystemPrompt !== DEFAULT_SYSTEM_PROMPT) {
                previewEl.textContent = currentSystemPrompt.length > 20 ? 
                    currentSystemPrompt.substring(0, 20) + '...' : 
                    currentSystemPrompt;
                statusEl.classList.remove('hidden');
            } else {
                statusEl.classList.add('hidden');
            }
        }

        // ================= 对话管理 =================
        function saveCurrentChat() {
            if (!currentChatId) return;
            
            const chatData = { 
                rootId, 
                activeNodeId, 
                nodeMap,
                systemPrompt: currentSystemPrompt
            };
            
            localStorage.setItem(`esa_chat_${currentChatId}`, JSON.stringify(chatData));
            const rootNode = nodeMap[rootId];
            const title = rootNode ? rootNode.content.substring(0, 10) + "..." : "新对话";
            const existingIndex = chatHistory.findIndex(c => c.id === currentChatId);
            if (existingIndex >= 0) {
                chatHistory[existingIndex].title = title;
                chatHistory[existingIndex].timestamp = Date.now();
            } else {
                chatHistory.unshift({ id: currentChatId, title, timestamp: Date.now() });
            }
            localStorage.setItem('esa_mindforest_history', JSON.stringify(chatHistory));
            loadSidebar();
            document.getElementById('current-chat-title').innerText = title;
        }
        
        async function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;
            if (!file.name.endsWith('.docx')) { alert('仅支持 .docx'); return; }
            const preview = document.getElementById('file-preview');
            preview.classList.remove('hidden');
            document.getElementById('file-name').innerText = file.name;
            try {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                currentFileContent = result.value;
            } catch (e) { alert("解析失败"); }
        }
        
        function clearFile() {
            document.getElementById('file-upload').value = '';
            document.getElementById('file-preview').classList.add('hidden');
            currentFileContent = null;
        }
        
        function loadSidebar() {
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = '';
            chatHistory.forEach(chat => {
                const item = document.createElement('div');
                item.className = `p-3 rounded cursor-pointer transition-colors flex justify-between group text-sm mb-1 ${chat.id === currentChatId ? 'bg-slate-800' : 'hover:bg-slate-800'}`;
                item.innerHTML = `<div class="truncate flex-1" onclick="loadChat('${chat.id}')">${chat.title}</div><button onclick="deleteChat('${chat.id}', event)" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-red-400 ml-2"><i class="fa-solid fa-trash"></i></button>`;
                listEl.appendChild(item);
            });
        }
        
        function createNewChat() {
            currentChatId = Date.now().toString();
            nodeMap = {}; rootId = null; activeNodeId = null; branchParentId = null;
            currentSystemPrompt = DEFAULT_SYSTEM_PROMPT;
            autoGreetingEnabled = true; // 启用自动问候
            
            document.getElementById('chat-container').innerHTML = `<div class="text-center text-gray-400 mt-20"><i class="fa-solid fa-seedling text-4xl mb-4 text-green-300"></i><br>开始一颗新的思维树</div>`;
            document.getElementById('current-chat-title').innerText = "新对话";
            
            document.getElementById('system-prompt-status').classList.add('hidden');
            
            if (document.getElementById('stream-view').style.opacity === '0') toggleView();
            loadSidebar();
            
            // 自动发送"你好"
            setTimeout(() => {
                if (autoGreetingEnabled) {
                    document.getElementById('user-input').value = '你好';
                    sendMessage();
                }
            }, 500);
        }
        
        function loadChat(chatId) {
            const dataStr = localStorage.getItem(`esa_chat_${chatId}`);
            if (!dataStr) return;
            const data = JSON.parse(dataStr);
            currentChatId = chatId; 
            nodeMap = data.nodeMap; 
            rootId = data.rootId; 
            activeNodeId = data.activeNodeId;
            currentSystemPrompt = data.systemPrompt || DEFAULT_SYSTEM_PROMPT;
            autoGreetingEnabled = false; // 加载已有对话时不自动问候
            
            const hist = chatHistory.find(c => c.id === chatId);
            if(hist) document.getElementById('current-chat-title').innerText = hist.title;
            
            renderStreamView(); 
            loadSidebar();
            if (document.getElementById('stream-view').style.opacity === '0') initTree();
        }
        
        function deleteChat(chatId, event) {
            event.stopPropagation();
            if(!confirm("删除?")) return;
            localStorage.removeItem(`esa_chat_${chatId}`);
            chatHistory = chatHistory.filter(c => c.id !== chatId);
            localStorage.setItem('esa_mindforest_history', JSON.stringify(chatHistory));
            if (currentChatId === chatId) createNewChat(); else loadSidebar();
        }
    </script>
</body>
